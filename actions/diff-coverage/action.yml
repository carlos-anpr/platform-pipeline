name: Cobertura del diff (plataforma)
description: Porcentaje de líneas cambiadas que ejecutan los tests; falla por debajo del mínimo.
inputs:
  base: {description: Commit base, required: true}
  allow-file: {description: Excepciones (repos/<repo>.json), required: true}
  min: {description: Cobertura mínima (%), default: "80"}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE: ${{ inputs.base }}
        ALLOW: ${{ inputs.allow-file }}
        MIN: ${{ inputs.min }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
        "$PY" "$GITHUB_ACTION_PATH/check-diff-coverage.py" --base "$BASE" --allow-file "$ALLOW" --min "$MIN"
